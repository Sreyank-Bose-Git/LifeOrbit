<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="128" height="128" rx="32" fill="#040508"/>
  <circle cx="64" cy="64" r="54" fill="url(#bgGlow)"/>

  <!-- Orbital Ellipse Back -->
  <ellipse cx="64" cy="64" rx="46" ry="18" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" opacity="0.85" transform="rotate(-28 64 64)" stroke-dasharray="8 3" filter="url(#glow)"/>

  <!-- Core Sphere with 3D highlights -->
  <circle cx="64" cy="64" r="22" fill="url(#orbGrad)" filter="url(#glow)"/>
  <circle cx="57" cy="57" r="7" fill="#ffffff" opacity="0.6" filter="blur(1px)"/>

  <!-- Orbital Planetoid -->
  <circle cx="98" cy="46" r="4.5" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="30" cy="82" r="3.5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Inner Sparkle -->
  <polygon points="64,48 66,62 80,64 66,66 64,80 62,66 48,64 62,62" fill="#ffffff" opacity="0.9" />
</svg>
